[project]
name = "watchtower"
version = "0.1.0"
description = "Watch GitHub repos, summarise new activity with a local LLM, report to Telegram."
requires-python = ">=3.14"
# Standard library only, on purpose -- except RS256 for the GitHub App's JWT (poster).
dependencies = ["cryptography==50.0.1"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "B", "C4", "PIE", "LOG"]

[tool.pytest.ini_options]
testpaths = ["tests"]
