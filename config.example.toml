# Copy to /opt/watchtower/config.toml on the host and fill in.
# The IDs aren't secrets, but they are yours: keep the real file out of git.

[github]
# "owner/name", one per line. The read token (secrets/github_read) must cover
# every repo listed: fine-grained PAT → Repository access → Only select repositories.
repos = [
    "JustChr/BavarianData",
    "JustChr/watchtower",
]
poll_seconds = 120                # minimum 60
ignore_authors = ["JustChr"]      # your own activity isn't reported
backfill_hours = 0                # first start only: also report items this many hours old
history_minutes = 60              # sync history (issues, PRs, discussions) + code snapshot; 0 = off
# The GitHub App that posts replies you approved (its key: secrets/github_app_key).
# Its App ID or Client ID, from the App's settings page; "" = nothing can be posted.
app_id = ""

[telegram]
chat_id = -1001234567890          # the group (getUpdates: chat.id, starts with -100)
allowed_user_id = 123456789       # you (getUpdates: from.id); nobody else can command the bot

[telegram.topics]                 # message_thread_id per topic; 0 = General
triage = 0                        # issues and their comments
reviews = 0                       # pull requests and their comments
replies = 0                       # discussions
system = 0                        # startup, errors, /status

[web]
# The web UI: how Watchtower works, what it's doing, everything it did. On the LAN
# without a login; it can edit and reject drafts, but posting still needs your
# tap in Telegram. compose.yaml publishes it on the box's port 8780.
port = 8080                       # inside the container
# Names you open it by (IP addresses always work). Others are refused, so a
# website can't reach it through a name it points at this box.
hosts = ["watchtower.home.arpa"]

[llm]
# Both models must appear in `docker exec ollama ollama list`; "" turns that job off.
# Local models only (no *-cloud: prompts would leave the box).
url = "http://ollama:11434"       # the ollama container, over the watchtower-llm network

# One-line summaries of every new issue, PR, comment. The agent model writes
# them better than a small coder model, and summaries are short, so its speed
# hardly matters. With the same model as agent_model, summaries use
# agent_num_ctx (a different context makes Ollama reload the model each time).
summary_model = "gpt-oss:120b"
num_ctx = 16384                   # used only by a separate summary model
timeout_seconds = 180

# Big: writes the repo brief and the reply drafts (later: PR reviews). Reads up
# to ~60k characters of docs + the file list, so it needs a large context.
agent_model = "gpt-oss:120b"      # MoE, 5B active, ~65 GB of the box's 128 GB
agent_num_ctx = 131072            # gpt-oss's maximum; investigating needs room
agent_timeout_seconds = 900
agent_think = "high"              # reasoning effort: low / medium / high; "" = the model's default
                                  # (low/medium/high is gpt-oss's; another model may refuse it)
agent_steps = 20                  # before judging an issue: rounds of looking things up
                                  # (code at the author's version, attached files, history); 0 = off
brief_betas = true                # a new beta release gets a new brief too; false = stable only
run_checks = false                # run each PR's checks (from its repo's CI) in the sandbox:
                                  # needs the runner service and gVisor; see README
review_prs = true                 # draft a review of every stranger's new pull request
draft_replies = true              # draft a reply when an issue/discussion (or a comment) needs one
