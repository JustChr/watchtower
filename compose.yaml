# Watchtower: watcher, gateway, worker, poster, web. Deploy as a Portainer stack or with
# `docker compose up -d`. Host prerequisites are in README.md.
# The image is built by .github/workflows/image.yml; nothing is built on the host.
# Each service holds only its own secret. All model work is the worker's: it holds
# none and has no internet, and it's the only service that can reach the model.

name: watchtower

x-service: &service
  image: ghcr.io/justchr/watchtower:latest
  pull_policy: always
  restart: unless-stopped
  init: true
  user: "10001:10001"
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  mem_limit: 256m
  pids_limit: 64
  volumes:
    - /opt/watchtower/data:/data
    - /opt/watchtower/config.toml:/config/config.toml:ro
  logging:
    driver: json-file
    options: {max-size: 5m, max-file: "3"}

services:
  watcher:
    <<: *service
    command: [watcher]
    secrets: [github_read]
    networks: [egress]        # GitHub only; never talks to the model
    healthcheck:
      test: [CMD, python, -m, watchtower, health, watcher, "900"]
      interval: 60s
      start_period: 60s

  gateway:
    <<: *service
    command: [gateway]
    secrets: [telegram_token]
    networks: [egress]
    healthcheck:
      test: [CMD, python, -m, watchtower, health, gateway, "120"]
      interval: 60s
      start_period: 30s

  worker:
    <<: *service
    command: [worker]
    networks: [llm]           # internal: Ollama only, no internet, no secrets
    healthcheck:              # one model call can take agent_timeout_seconds (900)
      test: [CMD, python, -m, watchtower, health, worker, "1200"]
      interval: 60s
      start_period: 30s

  poster:
    <<: *service
    command: [poster]
    secrets: [github_app_key]
    networks: [egress]        # GitHub only; never talks to the model
    healthcheck:
      test: [CMD, python, -m, watchtower, health, poster, "120"]
      interval: 60s
      start_period: 30s

  web:
    <<: *service
    command: [web]
    networks: [web]           # LAN only for the page; holds no secret
    ports: ["8780:8080"]      # http://<box>:8780; the right side is [web] port
    healthcheck:
      test: [CMD, python, -m, watchtower, health, web, "120"]
      interval: 60s
      start_period: 30s

secrets:
  github_read:
    file: /opt/watchtower/secrets/github_read
  telegram_token:
    file: /opt/watchtower/secrets/telegram_token
  github_app_key:
    file: /opt/watchtower/secrets/github_app_key

networks:
  egress: {}
  web: {}
  llm:
    name: watchtower-llm
    external: true
